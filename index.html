<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar de licitaciones — residuos</title>
<style>
:root {
  --bg: #f5f7f9; --card: #ffffff; --text: #1d2a33; --muted: #5d6b76; --line: #dde3e8;
  --accent: #0f6e8c; --accent-soft: #e2f1f6;
  --a: #1b7f4c; --a-soft: #e1f3e9; --b: #9a6a00; --b-soft: #fbf0d6; --c: #6b7680; --c-soft: #eceff2;
  --new: #b4235a; --new-soft: #fbe4ed; --warn: #b4461c;
  --ok: #1b7f4c; --no: #b4235a; --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181d; --card: #1a2329; --text: #e3e9ed; --muted: #9aa8b2; --line: #2c3840;
    --accent: #5cb8d6; --accent-soft: #173341;
    --a: #6fd09c; --a-soft: #183528; --b: #e5b54a; --b-soft: #3a2f14; --c: #a5b0b8; --c-soft: #262f35;
    --new: #f07aa6; --new-soft: #3e1a29; --warn: #f0905f; --ok: #6fd09c; --no: #f07aa6; --on-accent: #0b1a20;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding-bottom: 80px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
header { padding: 24px 0 8px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; }
.resumen { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.pill b { font-variant-numeric: tabular-nums; }
.filtros { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; }
.filtros input[type=search], .filtros select { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
.fila2 { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
  padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.contador { color: var(--muted); margin-left: auto; }
.lista { display: grid; gap: 10px; margin-top: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.nivel { font-weight: 700; border-radius: 6px; padding: 1px 8px; }
.nivel.A { color: var(--a); background: var(--a-soft); } .nivel.B { color: var(--b); background: var(--b-soft); }
.nivel.C { color: var(--c); background: var(--c-soft); }
.nueva { color: var(--new); background: var(--new-soft); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
.codigo { color: var(--accent); text-decoration: none; font-weight: 600; }
.codigo:hover { text-decoration: underline; }
.tipo { color: var(--muted); }
.nombre { font-size: 16px; font-weight: 600; margin: 6px 0 2px; }
.donde { color: var(--muted); font-size: 14px; }
.datos { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; font-size: 14px; }
.datos span b { font-weight: 600; font-variant-numeric: tabular-nums; }
.urgente { color: var(--warn); }
.cerrada { opacity: .6; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cat { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; }
.cat.pen { background: var(--c-soft); color: var(--c); }
details { margin-top: 8px; font-size: 14px; color: var(--muted); }
summary { cursor: pointer; }
.fb { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.fb button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
  padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.fb button.si[aria-pressed=true] { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.fb button.no[aria-pressed=true] { background: var(--no); border-color: var(--no); color: var(--on-accent); }
.fb input { flex: 1; min-width: 180px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 0; z-index: 10; }
.barra .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.barra a, .barra button { border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.enviar { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
.copiar { background: var(--card); color: var(--text); border: 1px solid var(--line); }
.vacio { text-align: center; color: var(--muted); padding: 40px 0; }
.nota { color: var(--muted); font-size: 13px; margin: 18px 0; }
@media (max-width: 720px) {
  .filtros { grid-template-columns: 1fr 1fr; position: static; }
  .filtros .busca { grid-column: 1 / -1; }
  .contador { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo"></h1>
    <div class="sub" id="sub"></div>
    <div class="resumen" id="resumen"></div>
  </header>

  <div class="filtros">
    <input class="busca" type="search" id="q" placeholder="Buscar comprador, comuna, código o palabra…" aria-label="Buscar">
    <select id="region" aria-label="Región"><option value="">Todas las regiones</option></select>
    <select id="grupo" aria-label="Tipo"><option value="">Todos los tipos</option></select>
    <select id="plazo" aria-label="Cierre">
      <option value="">Cualquier cierre</option>
      <option value="7">Cierra en 7 días o menos</option>
      <option value="14">Cierra en 14 días o menos</option>
      <option value="30">Cierra en 30 días o menos</option>
    </select>
    <div class="fila2">
      <span>Nivel:</span>
      <button class="chip" data-nivel="A" aria-pressed="true">A</button>
      <button class="chip" data-nivel="B" aria-pressed="true">B</button>
      <button class="chip" data-nivel="C" aria-pressed="false">C</button>
      <label class="chk"><input type="checkbox" id="nuevas"> Solo nuevas</label>
      <label class="chk"><input type="checkbox" id="sinfb"> Sin responder</label>
      <select id="orden" aria-label="Orden" style="width:auto">
        <option value="cierre">Ordenar por cierre</option>
        <option value="nivel">Ordenar por nivel</option>
        <option value="monto">Ordenar por monto</option>
        <option value="region">Ordenar por región</option>
      </select>
      <span class="contador" id="contador"></span>
    </div>
  </div>

  <div class="lista" id="lista"></div>

  <p class="nota"><span id="leyenda"></span> El radar lee el nombre y la ficha pública de cada licitación,
    no las bases: requisitos, visitas a terreno y garantías hay que verlos en la ficha. "Reservado" = el monto está
    solo en las bases. Tus respuestas quedan guardadas en este navegador hasta que las envíes.</p>
</div>

<div class="barra">
  <div class="wrap">
    <span id="fbcuenta"></span>
    <a class="enviar" id="enviar" href="#">Enviar respuestas</a>
    <button class="copiar" id="copiar" type="button">Copiar respuestas</button>
  </div>
</div>

$('sub').textContent = `Actualizado el ${CONFIG.fecha_larga}` + (CONFIG.fecha_antes ? ` · "Nueva" = no estaba en el radar del ${CONFIG.fecha_antes}` : '');
const abiertas = DATOS.filter(d => dias(d.cierre) === null || dias(d.cierre) >= 0);
const cuenta = k => abiertas.filter(d => d.nivel === k).length;
$('resumen').innerHTML = `<span class="pill"><b>${abiertas.length}</b> abiertas</span>` +
  ['A', 'B', 'C'].map(k => `<span class="pill">Nivel ${k}: <b>${cuenta(k)}</b></span>`).join('') +
  `<span class="pill"><b>${abiertas.filter(d => d.nueva).length}</b> nuevas</span>`;
CONFIG.regiones.forEach(r => $('region').insertAdjacentHTML('beforeend', `<option>${esc(r)}</option>`));
CONFIG.grupos.forEach(g => $('grupo').insertAdjacentHTML('beforeend', `<option>${esc(g)}</option>`));

const niveles = new Set(['A', 'B']);
document.querySelectorAll('.chip[data-nivel]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.nivel; niveles.has(k) ? niveles.delete(k) : niveles.add(k);
  b.setAttribute('aria-pressed', niveles.has(k)); pintar();
}));
['q', 'region', 'grupo', 'plazo', 'nuevas', 'sinfb', 'orden'].forEach(id => $(id).addEventListener('input', pintar));

function tarjeta(d) {
  const dd = dias(d.cierre), cerrada = dd !== null && dd < 0;
  const f = FB[d.codigo] || {};
  const cats = (d.similar_a || '').split(',').map(s => s.trim()).filter(Boolean)
    .map(c => `<span class="cat">${esc(c)}</span>`).join('') + (d.vial ? '<span class="cat pen">fuera del foco</span>' : '');
  const preg = d.fin_preguntas && dias(d.fin_preguntas) >= 0 ? `<span>Preguntas hasta <b>${fecha(d.fin_preguntas)}</b></span>` : '';
  return `<article class="card${cerrada ? ' cerrada' : ''}" data-codigo="${esc(d.codigo)}">
    <div class="top"><span class="nivel ${d.nivel}">${d.nivel}</span>${d.nueva ? '<span class="nueva">Nueva</span>' : ''}
      <a class="codigo" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.codigo)}</a>
      <span class="tipo">${esc(d.tipo || '')}${TIPOS[d.tipo] ? ' · ' + TIPOS[d.tipo] : ''}</span></div>
    <div class="nombre">${esc(d.nombre)}</div>
    <div class="donde">${esc(d.organismo)} · ${esc(d.comuna || '')}${d.comuna ? ', ' : ''}${esc(d.region)}</div>
    <div class="datos">
      <span class="${!cerrada && dd !== null && dd <= 7 ? 'urgente' : ''}">Cierre <b>${fecha(d.cierre)} ${d.cierre ? d.cierre.slice(11, 16) : ''}</b>
        ${dd === null ? '' : cerrada ? '(cerrada)' : `(${dd} ${dd === 1 ? 'día' : 'días'})`}</span>
      ${preg}<span>Monto <b>${plata(d.monto_estimado)}</b></span></div>
    <div class="cats">${cats}</div>
    ${d.descripcion ? `<details><summary>Descripción</summary>${esc(d.descripcion)}</details>` : ''}
    <div class="fb">
      <button class="si" aria-pressed="${f.v === 'si'}" data-v="si">Me sirve</button>
      <button class="no" aria-pressed="${f.v === 'no'}" data-v="no">No me sirve</button>
      <input type="text" placeholder="¿Por qué? (zona, monto, tipo de trabajo, plazo…)" value="${esc(f.m || '')}">
    </div></article>`;
}

function pintar() {
  const q = norm($('q').value), reg = $('region').value, gr = $('grupo').value, pl = +$('plazo').value || null;
  let r = DATOS.filter(d => {
    const dd = dias(d.cierre);
    if (dd !== null && dd < 0) return false;
    if (!niveles.has(d.nivel)) return false;
    if (reg && d.region !== reg) return false;
    if (gr && !(d.similar_a || '').split(',').map(s => s.trim()).includes(gr)) return false;
    if (pl && (dd === null || dd > pl)) return false;
    if ($('nuevas').checked && !d.nueva) return false;
    if ($('sinfb').checked && FB[d.codigo]?.v) return false;
    if (q && !norm([d.codigo, d.nombre, d.organismo, d.comuna, d.region, d.descripcion].join(' ')).includes(q)) return false;
    return true;
  });
  const o = $('orden').value;
  const porCierre = (a, b) => (a.cierre || '9999').localeCompare(b.cierre || '9999');
  r.sort(o === 'nivel' ? (a, b) => a.nivel.localeCompare(b.nivel) || porCierre(a, b)
    : o === 'monto' ? (a, b) => (b.monto_estimado || 0) - (a.monto_estimado || 0)
    : o === 'region' ? (a, b) => CONFIG.regiones.indexOf(a.region) - CONFIG.regiones.indexOf(b.region) || porCierre(a, b)
    : porCierre);
  $('contador').textContent = `${r.length} de ${abiertas.length} abiertas`;
  $('lista').innerHTML = r.length ? r.map(tarjeta).join('') : '<div class="vacio">Ninguna licitación con estos filtros.</div>';
  barra();
}

$('lista').addEventListener('click', e => {
  const b = e.target.closest('.fb button'); if (!b) return;
  const c = b.closest('.card').dataset.codigo, f = FB[c] || {};
  f.v = f.v === b.dataset.v ? null : b.dataset.v; FB[c] = f; guardarFB();
  b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === f.v));
  barra();
});
$('lista').addEventListener('input', e => {
  if (!e.target.matches('.fb input')) return;
  const c = e.target.closest('.card').dataset.codigo; FB[c] = { ...(FB[c] || {}), m: e.target.value }; guardarFB(); barra();
});

function textoFB() {
  const porCod = Object.fromEntries(DATOS.map(d => [d.codigo, d]));
  return Object.entries(FB).filter(([c, f]) => (f.v || f.m) && porCod[c]).map(([c, f]) =>
    `${c} — ${f.v === 'si' ? 'ME SIRVE' : f.v === 'no' ? 'NO ME SIRVE' : 'sin marcar'}${f.m ? ': ' + f.m : ''}\n   (${porCod[c].nombre})`).join('\n');
}
function barra() {
  const t = textoFB(), n = t ? t.split('\n').filter(l => !l.startsWith('   ')).length : 0;
  $('fbcuenta').textContent = n ? `${n} ${n === 1 ? 'respuesta marcada' : 'respuestas marcadas'}` : 'Marca "Me sirve" o "No me sirve" en cada licitación';
  $('enviar').href = `mailto:${CONFIG.feedback_a}?subject=${encodeURIComponent('Feedback radar ' + CONFIG.fecha_larga)}&body=${encodeURIComponent(t)}`;
}
$('copiar').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(textoFB()); $('copiar').textContent = 'Copiado'; }
  catch (e) { $('copiar').textContent = 'No se pudo copiar'; }
  setTimeout(() => $('copiar').textContent = 'Copiar respuestas', 2000);
});
pintar();
</script>
</body>
</html>
